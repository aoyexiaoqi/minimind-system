[supervisord]
nodaemon=false
logfile=/data/home/minimind-system/logs/supervisord.log
pidfile=/data/home/minimind-system/supervisord.pid

[program:minimind-service]
command=/data/home/minimind-system/venv/bin/uvicorn serving.app:app --host 0.0.0.0 --port 8080
directory=/data/home/minimind-system
environment=MODEL_DIR="/data/home/minimind-system/current",MINIMIND_REPO="/data/home/minimind",TORCH_THREADS="2",TORCH_INTEROP_THREADS="1"
autostart=true
autorestart=true
stdout_logfile=/data/home/minimind-system/logs/service.log
stderr_logfile=/data/home/minimind-system/logs/service.log
; SERVICE_TOKEN 通过 secrets.env 注入：启动 supervisord 前先 `set -a; . /data/home/minimind-system/secrets.env; set +a` 再运行 supervisord -c 此文件，环境变量会传递给子进程。
